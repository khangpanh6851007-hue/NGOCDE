name: Deploy to GitHub Pages

on:
  # Tự động kích hoạt khi có lệnh push lên nhánh main (hoặc master)
  push:
    branches: ["main"]

  # Cho phép bạn bấm nút chạy thủ công (Run workflow) từ tab Actions trên GitHub
  workflow_dispatch:

# Phân quyền cần thiết cho GITHUB_TOKEN để tương tác với GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Tránh việc nhiều bản build chạy chồng chéo cùng lúc
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v4

      - name: Tải lên gói dữ liệu trang web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Trỏ tới thư mục gốc chứa file index.html của bạn

      - name: Tiến hành triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
