name: Deploy Cung Troi Hoa Lac Ultra 2027 to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p dist
          if [ -f index.html ]; then
            cp index.html dist/index.html
          elif [ -f index_ultra2027_v5_local.html ]; then
            cp index_ultra2027_v5_local.html dist/index.html
          else
            echo "Không tìm thấy index.html hoặc index_ultra2027_v5_local.html"
            exit 1
          fi
          [ ! -f manifest.webmanifest ] || cp manifest.webmanifest dist/
          [ ! -f sw.js ] || cp sw.js dist/
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
