name: Deploy Cung Troi Hoa Lac to GitHub Pages

on:
  push:
    branches: ["main"] # Đổi thành "master" nếu nhánh chính của bạn là master

  # Cho phép kích hoạt thủ công từ tab Actions trên GitHub
  workflow_dispatch:

# Phân quyền cho GITHUB_TOKEN để cấu hình và deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo chỉ có một tiến trình deploy chạy tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v4

      - name: Đóng gói mã nguồn tĩnh
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Lấy toàn bộ thư mục gốc chứa index.html

      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
