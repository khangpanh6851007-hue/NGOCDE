<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cung Trời Hóa Lạc</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 440px;
            width: 90%;
        }
        h1 {
            color: #ffd700;
            font-size: 22px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .clock-box, .calendar-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .box-title {
            font-size: 13px;
            color: #ffeb3b;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #clock {
            font-size: 30px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            letter-spacing: 2px;
        }
        #calendar {
            font-size: 15px;
            color: #ffffff;
            font-weight: 500;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            background: linear-gradient(135deg, #f12711, #f5af19);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(241, 39, 17, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(241, 39, 17, 0.6);
        }
        .btn-thien-dinh {
            background: linear-gradient(135deg, #2193b0, #6dd5ed);
            box-shadow: 0 4px 15px rgba(33, 147, 176, 0.4);
        }
        .btn-thien-dinh:hover {
            box-shadow: 0 6px 20px rgba(33, 147, 176, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Cung Trời Hóa Lạc ✨</h1>
        
        <!-- Đồng hồ ở cung trời hoá lạc tự động -->
        <div class="clock-box">
            <div class="box-title">⏰ Đồng hồ Nhân Gian</div>
            <div id="clock">00:00:00</div>
        </div>
        
        <!-- Lịch ở cung trời hoá lạc tự động -->
        <div class="calendar-box">
            <div class="box-title">📅 Lịch Nhân Gian</div>
            <div id="calendar">Đang tải lịch...</div>
        </div>

        <!-- Các nút liên kết -->
        <div class="links">
            <a href="https://khangpanh6851007-hue.github.io/Ngocdecungtroihoalac/" class="btn" target="_blank">👑 Ngọc Đế 🫅</a>
            <a href="https://khangpanh6851007-hue.github.io/ThienDinh/" class="btn btn-thien-dinh" target="_blank">🏛️ Thiên Đình</a>
        </div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            
            // Cập nhật đồng hồ tự động
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;

            // Cập nhật lịch tự động
            const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            let dayName = days[now.getDay()];
            let date = String(now.getDate()).padStart(2, '0');
            let month = String(now.getMonth() + 1).padStart(2, '0');
            let year = now.getFullYear();
            
            document.getElementById('calendar').innerText = `${dayName}, Ngày ${date}/${month}/${year}`;
        }

        // Chạy ngay lập tức và tự động cập nhật mỗi giây
        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>

</body>
</html>
