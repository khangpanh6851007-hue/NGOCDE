<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cung Trời Hóa Lạc - Bản Mobile Chuẩn</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --container-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 215, 0, 0.3);
            --text-main: #f5f5f5;
            --accent-gold: #ffd700;
            --clock-color: #00ffcc;
        }
        body.theme-gold {
            --bg-gradient: linear-gradient(135deg, #201305, #4a2707, #261304);
            --border-color: rgba(255, 223, 128, 0.4);
            --clock-color: #ffcc00;
        }
        body.theme-teal {
            --bg-gradient: linear-gradient(135deg, #051923, #003554, #006494);
            --border-color: rgba(0, 229, 255, 0.4);
            --clock-color: #00e5ff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; text-align: center; overflow-x: hidden;
            transition: background 0.5s ease;
        }
        #bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .top-controls {
            position: absolute; top: 15px; display: flex; gap: 8px; z-index: 10; flex-wrap: wrap; justify-content: center;
        }
        .theme-btn, .audio-control-btn, .admin-btn {
            background: rgba(0, 0, 0, 0.4); border: 1px solid var(--accent-gold); color: var(--accent-gold);
            padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold;
            backdrop-filter: blur(5px);
        }
        .container {
            background: var(--container-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--border-color); padding: 25px; border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); max-width: 440px; width: 92%;
            z-index: 2; margin-top: 60px; margin-bottom: 20px;
        }
        h1 { color: var(--accent-gold); font-size: 20px; margin-bottom: 15px; text-transform: uppercase; }
        .clock-box, .calendar-box, .divine-box {
            background: rgba(0, 0, 0, 0.4); padding: 12px; border-radius: 12px; margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .box-title { font-size: 12px; color: #ffeb3b; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; }
        #clock { font-size: 28px; font-weight: bold; color: var(--clock-color); }
        #calendar { font-size: 14px; color: #ffffff; }
        #divineMessage { font-size: 13px; color: #fffae6; font-style: italic; margin-bottom: 8px; min-height: 36px; display: flex; align-items: center; justify-content: center; }
        .divine-btn {
            background: linear-gradient(135deg, #8E2DE2, #4A00E0); color: white; border: none;
            padding: 6px 14px; border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .links { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn {
            background: linear-gradient(135deg, #f12711, #f5af19); color: white; padding: 11px 18px;
            border-radius: 25px; text-decoration: none; font-weight: bold; font-size: 14px; display: block;
            box-shadow: 0 4px 15px rgba(241, 39, 17, 0.4);
        }
        .btn-thien-dinh { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
        .btn-thien-duc { background: linear-gradient(135deg, #11998e, #38ef7d); }
        
        /* BẢNG QUẢN LÝ TRỰC TIẾP */
        #adminModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center;
        }
        .admin-card {
            background: #1a1a2e; border: 1px solid var(--accent-gold); padding: 20px;
            border-radius: 15px; width: 90%; max-width: 350px; text-align: left;
        }
        .admin-card h3 { color: var(--accent-gold); margin-top: 0; font-size: 16px; text-align: center; }
        .admin-card label { font-size: 12px; color: #ddd; display: block; margin-top: 8px; }
        .admin-card input, .admin-card select {
            width: 100%; padding: 8px; margin-top: 4px; border-radius: 8px; border: 1px solid #444;
            background: #111; color: #fff; font-size: 13px; outline: none;
        }
        .admin-actions { display: flex; gap: 10px; margin-top: 15px; }
        .admin-actions button {
            flex: 1; padding: 8px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;
        }
        .btn-save { background: #38ef7d; color: #000; }
        .btn-close { background: #ff3366; color: #fff; }
        
        .custom-link-wrapper { position: relative; width: 100%; }
        .btn-custom { padding-right: 45px; border: none; text-decoration: none; font-weight: bold; font-size: 14px; display: block; border-radius: 25px; color: white; padding-top: 11px; padding-bottom: 11px; padding-left: 18px; }
        
        /* 7 màu tùy chỉnh cho nút liên kết */
        .btn-custom.custom-color-1 { background: linear-gradient(135deg, #654ea3, #eaafc8); box-shadow: 0 4px 15px rgba(101, 78, 163, 0.4); }
        .btn-custom.custom-color-2 { background: linear-gradient(135deg, #2193b0, #6dd5ed); box-shadow: 0 4px 15px rgba(33, 147, 176, 0.4); }
        .btn-custom.custom-color-3 { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4); }
        .btn-custom.custom-color-4 { background: linear-gradient(135deg, #f12711, #f5af19); box-shadow: 0 4px 15px rgba(241, 39, 17, 0.4); }
        .btn-custom.custom-color-5 { background: linear-gradient(135deg, #cb356b, #bd3f32); box-shadow: 0 4px 15px rgba(203, 53, 107, 0.4); }
        .btn-custom.custom-color-6 { background: linear-gradient(135deg, #f7971e, #ffd200); box-shadow: 0 4px 15px rgba(247, 151, 30, 0.4); }
        .btn-custom.custom-color-7 { background: linear-gradient(135deg, #4776E6, #8E54E9); box-shadow: 0 4px 15px rgba(71, 118, 230, 0.4); }

        .delete-custom {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4); border: none; color: #fff; font-size: 12px;
            width: 24px; height: 24px; border-radius: 50%; cursor: pointer; z-index: 3;
        }
        .instruction { font-size: 11px; color: rgba(255, 255, 255, 0.5); margin-top: 10px; }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="top-controls">
        <button class="audio-control-btn" id="audioBtn">🎵 Âm Thanh: Tắt</button>
        <button class="theme-btn" id="themeBtn">🎨 Đổi Màu</button>
        <button class="admin-btn" id="adminBtn">⚙️ Quản Lý</button>
    </div>

    <div class="container">
        <h1>✨ Cung Trời Hóa Lạc ✨</h1>
        
        <div class="clock-box">
            <div class="box-title">⏰ Đồng hồ Nhân Gian</div>
            <div id="clock">00:00:00</div>
        </div>
        
        <div class="calendar-box">
            <div class="box-title">📅 Lịch Nhân Gian</div>
            <div id="calendar">Đang tải lịch...</div>
        </div>

        <div class="divine-box">
            <div class="box-title">📜 Sấm Truyền Thiên Đình</div>
            <div id="divineMessage">"Tâm tịnh hướng thiên, vạn sự hanh thông."</div>
            <button class="divine-btn" id="divineBtn">Nhận Lộc Sấm Truyền</button>
        </div>

        <div class="links" id="linksContainer">
            <a href="https://khangpanh6851007-hue.github.io/Ngocdecungtroihoalac/" class="btn" target="_blank">👑 Ngọc Đế</a>
            <a href="https://khangpanh6851007-hue.github.io/ThienDinh/" class="btn btn-thien-dinh" target="_blank">🏛️ Thiên Đình</a>
            <a href="https://khangpanh6851007-hue.github.io/Lamviecthien/" class="btn btn-thien-duc" target="_blank">🌱 Làm Việc Thiện Tăng Phước Đức</a>
        </div>
        
        <div class="instruction">💡 Chạm vào màn hình bất kỳ để bắn pháo hoa cung trời!</div>
    </div>

    <div id="adminModal">
        <div class="admin-card">
            <h3>⚙️ Quản Lý Liên Kết</h3>
            <label>Mật Khẩu Quản Lý:</label>
            <input type="password" id="adminKey" placeholder="Nhập mật khẩu...">
            <label>Tên Nút Hiển Thị:</label>
            <input type="text" id="linkName" placeholder="Ví dụ: Trang Chủ">
            <label>Đường Dẫn URL:</label>
            <input type="text" id="linkUrl" placeholder="https://...">
            <label>Chọn Màu Giao Diện Nút:</label>
            <select id="linkColor">
                <option value="custom-color-1">🎨 Màu 1: Tím Hồng Huyền Ảo</option>
                <option value="custom-color-2">🎨 Màu 2: Xanh Dương Trời</option>
                <option value="custom-color-3">🎨 Màu 3: Xanh Ngọc Lục Bảo</option>
                <option value="custom-color-4">🎨 Màu 4: Cam Vàng Rực Rỡ</option>
                <option value="custom-color-5">🎨 Màu 5: Đỏ Hồng Quý Phái</option>
                <option value="custom-color-6">🎨 Màu 6: Vàng Đồng Kim Sa</option>
                <option value="custom-color-7">🎨 Màu 7: Tím Xanh Thiên Thanh</option>
            </select>
            <div class="admin-actions">
                <button class="btn-save" id="saveLinkBtn">Lưu Lại</button>
                <button class="btn-close" id="closeModalBtn">Đóng</button>
            </div>
        </div>
    </div>

    <script>
        function getStoredLinks() {
            try {
                let data = localStorage.getItem('khangpanh_custom_links');
                if (!data) return [];
                let links = JSON.parse(data);
                return Array.isArray(links) ? links : [];
            } catch (e) { return []; }
        }

        function renderCustomLinks() {
            const container = document.getElementById('linksContainer');
            if (!container) return;
            container.querySelectorAll('.custom-link-wrapper').forEach(el => el.remove());

            getStoredLinks().forEach((item) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'custom-link-wrapper';

                const a = document.createElement('a');
                a.href = item.url || '#';
                const colorClass = item.color || 'custom-color-1';
                a.className = `btn btn-custom ${colorClass}`;
                a.target = '_blank';
                a.innerText = item.name || 'Liên kết';

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-custom';
                delBtn.innerHTML = '✕';
                delBtn.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    let pass = prompt("Nhập mật khẩu để xóa (KhangPanh68):");
                    if (pass === "KhangPanh68") {
                        let links = getStoredLinks().filter(l => l.id !== item.id);
                        localStorage.setItem('khangpanh_custom_links', JSON.stringify(links));
                        renderCustomLinks();
                    }
                };

                wrapper.appendChild(a);
                wrapper.appendChild(delBtn);
                container.appendChild(wrapper);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderCustomLinks();

            const modal = document.getElementById('adminModal');
            document.getElementById('adminBtn').addEventListener('click', () => {
                modal.style.display = 'flex';
            });
            document.getElementById('closeModalBtn').addEventListener('click', () => {
                modal.style.display = 'none';
            });
            document.getElementById('saveLinkBtn').addEventListener('click', () => {
                const key = document.getElementById('adminKey').value.trim();
                const name = document.getElementById('linkName').value.trim();
                let url = document.getElementById('linkUrl').value.trim();
                const color = document.getElementById('linkColor').value;

                if (key !== "KhangPanh68") {
                    alert("❌ Sai mật khẩu quản lý!");
                    return;
                }
                if (!name || !url) {
                    alert("⚠️ Vui lòng điền đủ tên và URL!");
                    return;
                }
                if (!url.startsWith('http')) url = 'https://' + url;

                let links = getStoredLinks();
                links.push({ id: 'link_' + Date.now(), name, url, color });
                localStorage.setItem('khangpanh_custom_links', JSON.stringify(links));

                document.getElementById('adminKey').value = '';
                document.getElementById('linkName').value = '';
                document.getElementById('linkUrl').value = '';
                modal.style.display = 'none';
                renderCustomLinks();
                alert("✨ Thêm liên kết thành công!");
            });

            document.getElementById('audioBtn').addEventListener('click', toggleAudio);
            document.getElementById('themeBtn').addEventListener('click', toggleTheme);
            document.getElementById('divineBtn').addEventListener('click', getNewMessage);
        });

        function updateDateTime() {
            const now = new Date();
            const clockEl = document.getElementById('clock');
            if(clockEl) clockEl.innerText = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

            const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            const calendarEl = document.getElementById('calendar');
            if(calendarEl) calendarEl.innerText = `${days[now.getDay()]}, Ngày ${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        const messages = [
            "\"Tâm tịnh hướng thiên, vạn sự hanh thông, phước lộc tự khắc tề tựu.\"",
            "\"Ngọc Đế chiếu lệnh: Hôm nay đại cát, làm việc gì cũng hanh thông, suôn sẻ.\"",
            "\"Gió lành đưa lối, mây trắng che đầu, bình an là cội nguồn của phú quý.\"",
            "\"Thiên đình linh khí hội tụ, người thành tâm cầu nguyện ắt gặp quý nhân phù trợ.\""
        ];
        function getNewMessage() {
            playChimeSound();
            const msgEl = document.getElementById('divineMessage');
            if(msgEl) msgEl.innerText = messages[Math.floor(Math.random() * messages.length)];
        }

        const themes = ['', 'theme-gold', 'theme-teal'];
        let currentThemeIndex = 0;
        function toggleTheme() {
            playChimeSound();
            document.body.classList.remove(themes[currentThemeIndex]);
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            if(themes[currentThemeIndex]) document.body.classList.add(themes[currentThemeIndex]);
        }

        let audioCtx = null, isAudioPlaying = false, ambientInterval = null;
        function toggleAudio() {
            const btn = document.getElementById('audioBtn');
            if (!isAudioPlaying) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                isAudioPlaying = true;
                if(btn) btn.innerText = "🎵 Âm Thanh: Bật";
                ambientInterval = setInterval(() => { if (isAudioPlaying) playChimeSound(); }, 8000);
                playChimeSound();
            } else {
                isAudioPlaying = false;
                if(btn) btn.innerText = "🎵 Âm Thanh: Tắt";
                if (ambientInterval) clearInterval(ambientInterval);
            }
        }

        function playChimeSound() {
            try {
                const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = tempCtx.createOscillator();
                const gain = tempCtx.createGain();
                osc.frequency.setValueAtTime([523.25, 659.25, 783.99, 1046.50][Math.floor(Math.random()*4)], tempCtx.currentTime);
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.04, tempCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, tempCtx.currentTime + 2.5);
                osc.connect(gain); gain.connect(tempCtx.destination);
                osc.start(); osc.stop(tempCtx.currentTime + 2.5);
            } catch(e) {}
        }

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        let particles = Array.from({length: 50}, () => ({
            x: Math.random() * canvas.width, y: Math.random() * canvas.height,
            radius: Math.random() * 1.8 + 0.5, alpha: Math.random(),
            speed: Math.random() * 0.3 + 0.1, alphaSpeed: (Math.random() * 0.02 + 0.005) * (Math.random() < 0.5 ? 1 : -1)
        }));

        let fireworks = [];
        window.addEventListener('click', (e) => {
            if(e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || e.target.closest('#adminModal')) return;
            createFirework(e.clientX, e.clientY);
            playChimeSound();
        });

        function createFirework(x, y) {
            const color = ['#ffd700', '#00ffcc', '#ff3366', '#33ccff', '#ff9900'][Math.floor(Math.random()*5)];
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2, speed = Math.random() * 5 + 2;
                fireworks.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, alpha: 1, decay: Math.random()*0.02+0.015, color, radius: Math.random()*2+1 });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y -= p.speed; p.alpha += p.alphaSpeed;
                if (p.alpha <= 0.1 || p.alpha >= 1) p.alphaSpeed *= -1;
                if (p.y < 0) p.y = canvas.height;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`; ctx.fill();
            });
            fireworks.forEach((fw, index) => {
                fw.x += fw.vx; fw.y += fw.vy; fw.vy += 0.05; fw.alpha -= fw.decay;
                ctx.beginPath(); ctx.arc(fw.x, fw.y, fw.radius, 0, Math.PI * 2);
                ctx.fillStyle = fw.color; ctx.globalAlpha = Math.max(0, fw.alpha); ctx.fill(); ctx.globalAlpha = 1.0;
                if (fw.alpha <= 0) fireworks.splice(index, 1);
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
